<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Gökyüzü Haritası</title>
  <style>
    body { margin:0; background:black; color:white; overflow:hidden; font-family:Arial }
    #sky { position:absolute; width:100%; height:100%; background:radial-gradient(circle,#000,#020202) }

    .star-icon { position:absolute; transform:translate(-50%,-50%); text-align:center; cursor:pointer }
    .star-icon img { width:40px; height:40px; border-radius:50%; box-shadow:0 0 8px white }
    .label { font-size:11px }

    .dot { position:absolute; width:5px; height:5px; border-radius:50%; background:white; box-shadow:0 0 10px white }

    .line { position:absolute; height:2px; background:rgba(255,255,255,0.6); transform-origin:left }

    #popup {
      position:fixed; inset:0; background:rgba(0,0,0,0.8);
      display:none; align-items:center; justify-content:center
    }
    #popupBox {
      background:black; padding:20px; width:420px; border:1px solid #666; border-radius:10px;
      text-align:center
    }
    #popup img { width:100%; margin-top:10px }
    button { margin-top:15px; padding:6px 15px; background:#444; color:white; border:none; border-radius:5px }
  </style>
</head>
<body>

<div id="sky"></div>

<div id="popup">
  <div id="popupBox">
    <h3 id="ptitle"></h3>
    <p id="ptext"></p>
    <img id="pimg">
    <button onclick="closePopup()">Kapat</button>
  </div>
</div>

<script>
const sky = document.getElementById("sky");

const objects = [
 {name:"Güneş",x:50,y:90,text:"Merkez yıldız",img:"https://images-assets.nasa.gov/image/GSFC_20171208_Archive_e001435/GSFC_20171208_Archive_e001435~large.jpg"},
 {name:"Dünya",x:50,y:60,text:"Yaşadığımız gezegen",img:"https://upload.wikimedia.org/wikipedia/commons/9/97/The_Earth_seen_from_Apollo_17.jpg"},
 {name:"Ay",x:52,y:62,text:"Dünya'nın uydusu",img:"https://images-assets.nasa.gov/image/PIA00405/PIA00405~large.jpg"},
 {name:"Mars",x:60,y:65,text:"Kızıl gezegen",img:"https://upload.wikimedia.org/wikipedia/commons/0/02/OSIRIS_Mars_true_color.jpg"},
 {name:"Jüpiter",x:25,y:75,text:"En büyük gezegen",img:"https://upload.wikimedia.org/wikipedia/commons/e/e2/Jupiter.jpg"},
 {name:"Satürn",x:35,y:80,text:"Halkalı gezegen",img:"https://upload.wikimedia.org/wikipedia/commons/c/c7/Saturn_during_Equinox.jpg"},
 {name:"Venüs (Çoban Yıldızı)",x:65,y:40,text:"Parlak gezegen",img:"https://upload.wikimedia.org/wikipedia/commons/e/e5/Venus-real_color.jpg"},
 {name:"Büyük Ayı",x:20,y:20,text:"Takımyıldız",img:"https://assets.science.nasa.gov/content/dam/science/missions/hubble/releases/2007/03/STScI-01EVT72K10R4Z03NC5K04X3T4B.tif/jcr:content/renditions/800x1000.jpg"},
 {name:"Ülker (Pleiades)",x:75,y:25,text:"Yıldız kümesi",img:"https://images-assets.nasa.gov/image/PIA21408/PIA21408~large.jpg"}
];

// Objeler
objects.forEach(o=>{
 const d=document.createElement("div");
 d.className="star-icon";
 d.style.left=o.x+"vw"; d.style.top=o.y+"vh";
 d.innerHTML=`<img src="${o.img}"><div class="label">${o.name}</div>`;
 d.onclick=()=>openPopup(o);
 sky.appendChild(d);
});

// Arka plan yıldızları
for(let i=0;i<300;i++){
 const s=document.createElement("div");
 s.className="dot";
 s.style.left=Math.random()*100+"vw";
 s.style.top=Math.random()*100+"vh";
 sky.appendChild(s);
}

// Ülker yıldız noktaları
const pleiades = [
 {x:74,y:24},{x:75.2,y:23.2},{x:76,y:24.5},
 {x:74.6,y:25.5},{x:75.8,y:26},{x:76.4,y:25},
 {x:75.2,y:22.4}
];

pleiades.forEach(p=>{
 const s=document.createElement("div");
 s.className="dot";
 s.style.left=p.x+"vw"; s.style.top=p.y+"vh";
 sky.appendChild(s);
});

// Çizgi fonksiyonu
function connect(a,b){
 const l=document.createElement("div");
 l.className="line";
 const x1=a.x*innerWidth/100, y1=a.y*innerHeight/100;
 const x2=b.x*innerWidth/100, y2=b.y*innerHeight/100;
 const len=Math.hypot(x2-x1,y2-y1);
 const ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
 l.style.left=x1+"px"; l.style.top=y1+"px";
 l.style.width=len+"px"; l.style.transform=`rotate(${ang}deg)`;
 sky.appendChild(l);
}

for(let i=0;i<pleiades.length-1;i++) connect(pleiades[i],pleiades[i+1]);

// Popup
function openPopup(o){
 document.getElementById("ptitle").innerText=o.name;
 document.getElementById("ptext").innerText=o.text;
 document.getElementById("pimg").src=o.img;
 document.getElementById("popup").style.display="flex";
}
function closePopup(){
 document.getElementById("popup").style.display="none";
}
</script>
</body>
</html>
